name: Bug report
description: Something behaves differently than documented
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, what you got instead.
    validations:
      required: true
  - type: dropdown
    id: deployment
    attributes:
      label: How are you running Ansa
      options:
        - Self-hosted (Docker Compose)
        - Self-hosted (other)
        - Local development
        - ansa.so (hosted)
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Output of `git rev-parse --short HEAD`, or the release tag.
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Redact API keys and customer data before pasting.
      render: shell
