name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint and format
        run: pnpm lint

      - name: Type check
        run: pnpm type-check

      - name: Test
        run: pnpm --filter @ansa/api test

      # The dashboard build is the only place Turbopack and the App Router are
      # exercised, so a green type-check alone is not enough.
      - name: Build
        run: pnpm build
        env:
          BETTER_AUTH_SECRET: ci-placeholder-secret-not-used-at-build-time
