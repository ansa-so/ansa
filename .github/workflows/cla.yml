name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, synchronize, closed]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - uses: contributor-assistant/github-action@v2.6.1
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: .github/cla-signatures.json
          path-to-document: https://github.com/ansa-so/ansa/blob/main/CLA.md
          branch: cla-signatures
          # A CLA collects rights from external contributors. The copyright
          # holder does not need to license rights to itself, and gating
          # maintainers on it blocks every internal pull request. Add
          # maintainers here as they join.
          allowlist: jeremymarc,dependabot[bot]
