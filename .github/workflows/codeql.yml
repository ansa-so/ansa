name: CodeQL

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"

jobs:
  analyze:
    runs-on: ubuntu-latest
    # Code scanning on a private repository requires GitHub Advanced Security,
    # which this repo does not have. CodeQL is free on public repositories, so
    # this starts running by itself once the repo is made public — rather than
    # failing every pull request until then.
    if: github.event.repository.private == false
    permissions:
      # analyze calls the workflow-runs API, which needs actions: read. Without
      # it the analysis completes and then fails on upload with
      # "Resource not accessible by integration".
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@v4
